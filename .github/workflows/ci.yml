name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  synthetic-pipeline:
    name: Synthetic pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full pipeline (generate -> load -> analyze -> build)
        run: ./scripts/run_all.sh

      - name: Assert deliverables exist
        run: |
          for f in output/executive-memo.md output/dashboard.html output/analysis_results.json; do
            test -s "$f" || { echo "MISSING: $f"; exit 1; }
          done

      - name: Assert no regressions in headline numbers
        run: |
          python3 - <<'PY'
          import json, sys
          data = {r["title"]: r for r in json.load(open("output/analysis_results.json"))}
          seg = {r[0]: r for r in data["Segment economics (revenue vs expected loss)"]["rows"]}
          bands = data["Risk by origination band (loss must rise A->E)"]["rows"]

          # Loss rates must increase monotonically across origination bands
          rates = [r[2] for r in bands]
          if rates != sorted(rates):
              sys.exit(f"FAIL: loss rates not monotonic across bands: {rates}")

          # The growth segment must exist with sane economics
          s2 = seg.get("S2_revolver_headroom")
          if not s2 or s2[1] < 500:
              sys.exit(f"FAIL: headroom segment missing or too small: {s2}")

          # Margin must be positive for the top two segments
          for name in ("S2_revolver_headroom", "S3_maxed_out"):
              if seg[name][5] <= 0:
                  sys.exit(f"FAIL: {name} has non-positive margin")

          print(f"OK: monotonic loss {rates}; headroom n={s2[1]}, margin=${s2[5]}")
          PY

  real-pipeline:
    name: Real-data pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and reshape the UCI dataset
        run: python3 scripts/fetch_real_data.py

      - name: Run real-data analysis
        run: python3 scripts/run_real_analysis.py

      - name: Assert dataset validated and results produced
        run: |
          python3 - <<'PY'
          import json, sys
          results = {r["query"]: r for r in json.load(open("output/real/real_results.json"))}
          if len(results) < 9:
              sys.exit(f"FAIL: expected 9 result sets, got {len(results)}")

          # Q0: annualized loss rate must be plausible on total exposure
          q0 = {c: v for c, v in zip(results["Q0"]["columns"], results["Q0"]["rows"][0])}
          rate = q0["ann_rate_on_total_exposure_pct"]
          carried = q0["ann_rate_on_carried_pct"]
          if not (0.5 <= rate <= 15):
              sys.exit(f"FAIL: loss rate implausible on total exposure: {rate}%")
          if not (rate < carried):
              sys.exit("FAIL: exposure-based rate should be below carried-balance rate")

          # Q1: the overall default rate must match the published ~22.1% baseline.
          # This is the ETL validation that everything else depends on.
          q1 = results["Q1"]["rows"]
          total = sum(r[1] for r in q1)
          weighted = sum(r[1] * r[2] for r in q1) / total
          if not (21.5 <= weighted <= 22.7):
              sys.exit(f"FAIL: default rate {weighted:.2f}% off the published ~22.1% baseline")

          # Q1: risk must rise with delinquency depth. The deepest bucket (5+ months
          # late, n=65) dips slightly — a documented small-sample artifact — so we
          # assert the trend holds for the buckets large enough to be reliable, and
          # that the first bucket is far below the peak.
          rates = [(r[0], r[1], r[2]) for r in q1]
          reliable = [rate for _, n, rate in rates if n >= 300]
          if reliable != sorted(reliable):
              sys.exit(f"FAIL: default rates not rising across well-populated buckets: {reliable}")
          if rates[0][2] >= min(r for _, _, r in rates[1:]):
              sys.exit(f"FAIL: current-status default rate not below delinquent buckets: {rates}")

          print(f"OK: loss {rate}% on exposure ({carried}% on carried); "
                f"default rate {weighted:.2f}% matches baseline; "
                f"rising {reliable} (small buckets: {[f'{r}%' for _, n, r in rates if n < 300]})")
          PY

  loan-pipeline:
    name: Loan pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and clean the LendingClub loan files
        run: python3 scripts/fetch_loan_data.py

      - name: Run loan profitability analysis
        run: python3 scripts/run_loan_analysis.py

      - name: Assert the denominator guard and economics hold
        run: |
          python3 - <<'PY'
          import json, sys
          res = {r["query"]: r for r in json.load(open("output/loans/loan_results.json"))}
          if len(res) < 9:
              sys.exit(f"FAIL: expected 9 result sets, got {len(res)}")

          # Q0: the resolved-only charge-off rate must be HIGHER than the naive
          # all-loans rate. If that ever inverts, the ETL is mis-bucketing statuses.
          q0 = {c: v for c, v in zip(res["Q0"]["columns"], res["Q0"]["rows"][0])}
          if q0["chargeoff_rate_resolved_pct"] <= q0["chargeoff_rate_all_pct"]:
              sys.exit(f"FAIL: resolved rate should exceed the all-loans rate: {q0}")
          if not (10 <= q0["chargeoff_rate_resolved_pct"] <= 20):
              sys.exit(f"FAIL: charge-off rate outside plausible range: {q0}")

          # Q1: the portfolio must be profitable at a sane return
          q1 = {c: v for c, v in zip(res["Q1"]["columns"], res["Q1"]["rows"][0])}
          if q1["net_profit_millions"] <= 0:
              sys.exit(f"FAIL: portfolio not profitable: {q1}")
          if not (2 <= q1["return_on_principal_pct"] <= 25):
              sys.exit(f"FAIL: return on principal implausible: {q1['return_on_principal_pct']}%")

          # Q3: the headline finding — 36-month ROI rises with risk, while
          # 60-month ROI does not. Guard the shape of that conclusion.
          # Key by column name so this survives any column reordering.
          cols = res["Q3"]["columns"]
          recs = [dict(zip(cols, r)) for r in res["Q3"]["rows"]]
          t36 = {r["grade"]: r["roi_pct"] for r in recs if r["term_months"] == 36}
          t60 = {r["grade"]: r["roi_pct"] for r in recs if r["term_months"] == 60}
          if not (t36["A"] < t36["C"] < t36["E"]):
              sys.exit(f"FAIL: 36-month ROI should rise with risk: {t36}")
          if t60["D"] >= t36["D"]:
              sys.exit(f"FAIL: expected 60-month grade D ROI below 36-month: {t60['D']} vs {t36['D']}")

          print(f"OK: charge-off {q0['chargeoff_rate_resolved_pct']}% resolved "
                f"(vs {q0['chargeoff_rate_all_pct']}% naive); "
                f"${q1['net_profit_millions']}M profit at {q1['return_on_principal_pct']}%")
          print(f"    36mo ROI A->E {t36['A']} -> {t36['E']}; "
                f"60mo grade D {t60['D']} (pricing breakdown holds)")
          PY

  onboarding:
    name: Fresh-clone onboarding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Nothing installed yet — this is the state a stranger starts in.
      - name: Scripts must fail with guidance, not a traceback
        run: |
          set +e
          out=$(python3 scripts/run_loan_analysis.py 2>&1)
          code=$?
          set -e
          echo "$out"
          [ "$code" -ne 0 ] || { echo "FAIL: should exit non-zero without duckdb"; exit 1; }
          echo "$out" | grep -q "not available to this interpreter" \
            || { echo "FAIL: missing clear error"; exit 1; }
          echo "$out" | grep -qi "venv" \
            || { echo "FAIL: error should recommend a venv"; exit 1; }
          # Guard the exact confusion that broke a real user: a bare `pip install`
          # is refused on Homebrew/conda Python, so the guidance must not be that alone.
          echo "$out" | grep -qi "externally-managed-environment" \
            || { echo "FAIL: error should warn about PEP 668"; exit 1; }

      - name: Doctor script must run without dependencies
        run: |
          python3 scripts/requirements.py
          python3 scripts/requirements.py | grep -q "MISSING" \
            || { echo "FAIL: doctor should report missing modules"; exit 1; }

      - name: run_all.sh must fail cleanly without the module
        run: |
          set +e
          ./scripts/run_all.sh --quick >/tmp/ra.log 2>&1
          code=$?
          set -e
          cat /tmp/ra.log
          [ "$code" -ne 0 ] || { echo "FAIL: run_all.sh should exit non-zero"; exit 1; }
          grep -q "not available to this interpreter" /tmp/ra.log \
            || { echo "FAIL: run_all.sh should explain the problem"; exit 1; }

      - name: Documented quickstart must actually work
        run: |
          # Follow the README verbatim: venv + requirements.txt, then a pipeline.
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
          .venv/bin/python scripts/requirements.py | grep -q "virtualenv  : True" \
            || { echo "FAIL: doctor should detect the venv"; exit 1; }
          .venv/bin/python scripts/run_all.sh --quick >/dev/null 2>&1 || true
          PATH="$PWD/.venv/bin:$PATH" ./scripts/run_all.sh --quick
          test -s output/analysis_results.json \
            || { echo "FAIL: documented quickstart produced no output"; exit 1; }
          echo "OK: fresh clone -> venv -> pipeline works as documented"

  sql-lint:
    name: SQL executes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Every SQL statement must execute
        run: |
          ./scripts/run_all.sh --quick
          python3 - <<'PY'
          import sys, os
          sys.path.insert(0, "scripts")
          import duckdb
          from run_analysis import split_statements

          con = duckdb.connect("credit.duckdb")
          total = 0
          for f in ("sql/kpi_dashboard.sql", "sql/segmentation.sql", "sql/pricing_sensitivity.sql"):
              for stmt in split_statements(open(f).read()):
                  con.execute(stmt).fetchall()
                  total += 1
          print(f"OK: all {total} synthetic SQL statements execute")
          PY
